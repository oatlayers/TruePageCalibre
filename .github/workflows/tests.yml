name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile all sources
        run: python -m compileall -q plugin tests build_plugin.py run_tests.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build plugin
        run: python build_plugin.py
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: truepagecalibre-plugin
          path: dist/TruePageCalibre.zip
          if-no-files-found: error
